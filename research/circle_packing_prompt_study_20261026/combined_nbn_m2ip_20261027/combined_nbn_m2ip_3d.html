<script type="module">import * as THREE from 'three';import{OrbitControls}from'three/addons/controls/OrbitControls.js';const d=await fetch('./combined_nbn_3d_data.json').then(r=>r.json()),P=d.provenance;document.querySelector('#summary').innerHTML=`${P.nodes.toLocaleString()} nodes · ${P.edges.toLocaleString()} nearest-better edges · exact CodeT5+ NBN<br>${P.trialCount} prompt candidates: ${P.trialStatusCounts.valid||0} valid, ${P.trialStatusCounts.invalid_geometry||0} invalid, ${P.trialStatusCounts.timeout||0} timeout<br><span class="small">Orange = actual valid prompt candidates. Their edges are calculated from the combined graph.</span>`;
const s=new THREE.Scene();s.background=new THREE.Color(0x0c1426);s.fog=new THREE.Fog(0x0c1426,350,1050);const c=new THREE.PerspectiveCamera(56,innerWidth/innerHeight,1,2500);c.position.set(330,240,560);const r=new THREE.WebGLRenderer({antialias:true});r.setPixelRatio(Math.min(devicePixelRatio,2));r.setSize(innerWidth,innerHeight);document.body.append(r.domElement);const o=new OrbitControls(c,r.domElement);o.target.set(0,75,0);o.enableDamping=true;s.add(new THREE.HemisphereLight(0xcbe1ff,0x10182b,2));const grid=new THREE.GridHelper(700,24,0x3c5278,0x22324f);s.add(grid);
const pos=[],color=[];const base=[];const palette=[[.32,.39,.49],[.20,.70,.93],[.65,.47,.96],[.94,.30,.48],[1,.60,.08]];for(const n of d.nodes){pos.push(n[0],n[2],n[1]);base.push(...palette[n[3]]);color.push(...palette[n[3]]);}const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));g.setAttribute('color',new THREE.Float32BufferAttribute(color,3));const pm=new THREE.PointsMaterial({size:2.4,vertexColors:true,sizeAttenuation:true,transparent:true,opacity:.9});s.add(new THREE.Points(g,pm));
const ep=[],hp=[];for(const[a,b]of d.edges){const A=d.nodes[a],B=d.nodes[b],q=[A[0],A[2],A[1],B[0],B[2],B[1]];ep.push(...q);if(A[3]>=2)hp.push(...q);}const eg=new THREE.BufferGeometry();eg.setAttribute('position',new THREE.Float32BufferAttribute(ep,3));const lines=new THREE.LineSegments(eg,new THREE.LineBasicMaterial({color:0x91a9cf,transparent:true,opacity:.11}));s.add(lines);const hg=new THREE.BufferGeometry();hg.setAttribute('position',new THREE.Float32BufferAttribute(hp,3));s.add(new THREE.LineSegments(hg,new THREE.LineBasicMaterial({color:0xffb53b,transparent:true,opacity:.9})));
for(const t of d.trials.filter(x=>x.evaluation_status==='valid')){const m=new THREE.Mesh(new THREE.SphereGeometry(5.5,16,12),new THREE.MeshBasicMaterial({color:0xffb13b,wireframe:true}));m.position.set(t.x,t.z,t.y);s.add(m)}function refresh(){const show=[document.querySelector('#hist').checked,document.querySelector('#hist').checked,document.querySelector('#timeouts').checked,document.querySelector('#invalid').checked,document.querySelector('#valid').checked];const a=g.attributes.color.array;for(let i=0;i<d.nodes.length;i++){let v=show[d.nodes[i][3]],j=i*3;a[j]=v?base[j]:0;a[j+1]=v?base[j+1]:0;a[j+2]=v?base[j+2]:0}g.attributes.color.needsUpdate=true;lines.visible=document.querySelector('#edges').checked;pm.size=+document.querySelector('#size').value}for(const id of['hist','timeouts','invalid','valid','edges','size'])document.querySelector('#'+id).addEventListener('input',refresh);addEventListener('resize',()=>{c.aspect=innerWidth/innerHeight;c.updateProjectionMatrix();r.setSize(innerWidth,innerHeight)});(function f(){requestAnimationFrame(f);o.update();r.render(s,c)})();</script></body></html>
