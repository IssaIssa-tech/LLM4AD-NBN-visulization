<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LLM4ADD Visual Platform</title>
  <link rel="stylesheet" href="/static/styles.css">
  <script type="importmap">
    {
      "imports": {
        "three": "/static/vendor/three/build/three.module.js",
        "three/addons/": "/static/vendor/three/examples/jsm/"
      }
    }
  </script>
</head>
<body class="theme-light">
  <div class="app-shell">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark">L4D</div>
        <div class="brand-text">
          <div class="eyebrow">LLM4ADD Visual Workspace</div>
          <h1>LLM4ADD Visual Platform</h1>
        </div>
      </div>
      <div class="topbar-context" id="topbarContext"></div>
      <div class="header-actions">
        <button id="openBasin3d" type="button" class="ghost-button" title="在 3D 视图中打开当前 revision 的数据">
          <span>3D 搜索空间</span>
        </button>
        <button id="openMds3d" type="button" class="ghost-button" title="在 MDS 语义空间中打开当前 revision 的数据">
          <span>MDS 语义空间</span>
        </button>
        <button id="openJobDrawer" type="button" class="ghost-button">
          <span class="dot" id="jobDrawerDot"></span>
          <span>任务监控</span>
        </button>
        <button id="openComposerDrawer" type="button" class="primary-button">发起任务</button>
        <button id="themeToggleButton" type="button" class="ghost-button" aria-label="切换主题">
          <span class="theme-icon" aria-hidden="true">◐</span>
        </button>
      </div>
    </header>

    <main class="stage">
      <aside class="rail rail-left">
        <section class="panel rail-panel" id="workspaceListPanel"></section>
        <section class="panel rail-panel" id="revisionPanel"></section>
      </aside>

      <section class="stage-center">
        <section class="panel stage-graph" id="graphPanel"></section>
      </section>

      <aside class="rail rail-right">
        <section class="panel rail-panel" id="inspectorPanel"></section>
      </aside>
    </main>
  </div>

  <aside class="drawer" id="jobDrawer" aria-hidden="true">
    <div class="drawer-backdrop" data-drawer-close="jobDrawer"></div>
    <div class="drawer-body" role="dialog" aria-label="任务监控">
      <header class="drawer-header">
        <div>
          <div class="eyebrow">Job Console</div>
          <h2>任务监控</h2>
        </div>
        <button class="drawer-close" data-drawer-close="jobDrawer" type="button" aria-label="关闭">
          <span aria-hidden="true">✕</span>
        </button>
      </header>
      <div class="drawer-content" id="jobStatusPanel"></div>
    </div>
  </aside>

  <aside class="drawer drawer-left" id="composerDrawer" aria-hidden="true">
    <div class="drawer-backdrop" data-drawer-close="composerDrawer"></div>
    <div class="drawer-body" role="dialog" aria-label="发起任务">
      <header class="drawer-header">
        <div>
          <div class="eyebrow">Action Console</div>
          <h2>发起任务</h2>
        </div>
        <button class="drawer-close" data-drawer-close="composerDrawer" type="button" aria-label="关闭">
          <span aria-hidden="true">✕</span>
        </button>
      </header>
      <div class="drawer-content" id="composerPanel"></div>
    </div>
  </aside>

  <script src="/static/i18n-en.js"></script>
  <script type="module" src="/static/main.js"></script>
</body>
</html>
