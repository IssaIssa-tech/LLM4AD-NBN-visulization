<!doctype html><html lang="en"><meta charset="utf-8"><title>Research history</title>
<style>body{font:16px system-ui;max-width:1100px;margin:2rem auto;padding:1rem}input{min-width:320px}article{border:1px solid #aaa;border-radius:8px;margin:1rem 0;padding:1rem}pre{white-space:pre-wrap;overflow-wrap:anywhere}button,input{padding:.5rem}#status{margin:1rem 0}</style>
<h1>Research history</h1><p>Selected parents and NBN references, configuration changes, LLM calls and recorded samples. Earlier external experiments require explicit import. Missing information is not reconstructed.</p>
<form id="form"><label>Revision ID <input id="revision" required pattern="[A-Za-z0-9_-]+"></label> <button>Load history</button> <button type="button" id="export" disabled>Export JSON</button></form><p id="status"></p><main id="events"></main>
<script>let snapshot;const $=id=>document.getElementById(id);$('revision').value=new URLSearchParams(location.search).get('revision')||'';
$('form').onsubmit=async event=>{event.preventDefault();$('status').textContent='Loading…';$('events').replaceChildren();$('export').disabled=true;snapshot=null;try{const response=await fetch('/api/revisions/'+encodeURIComponent($('revision').value)+'/research-history');if(!response.ok)throw Error('HTTP '+response.status);snapshot=await response.json();$('status').textContent=snapshot.count+' events. '+snapshot.coverage;for(const item of snapshot.events){const article=document.createElement('article'),title=document.createElement('h2'),pre=document.createElement('pre');title.textContent=item.eventType+' — '+item.timestampUtc;pre.textContent=JSON.stringify(item.payload,null,2);article.append(title,pre);$('events').append(article)}$('export').disabled=false}catch(error){$('status').textContent=String(error)}};
$('export').onclick=()=>{if(!snapshot)return;const url=URL.createObjectURL(new Blob([JSON.stringify(snapshot,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='research-history-'+snapshot.revisionId+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};</script></html>
